<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimShield — Claims</title><link rel="stylesheet" href="styles.css"></head><body><div class="app-shell">
<aside class="app-sidebar"><a class="brand app-brand" href="index.html"><span class="brand-mark">C</span><span><strong>ClaimShield</strong><small>AI Fraud Intelligence</small></span></a><nav class="app-nav"><a data-nav="dashboard" href="dashboard.html"><span class="icon">⌂</span>Overview</a><a data-nav="check" href="check-claim.html"><span class="icon">✦</span>Check Claim</a><a data-nav="claims" href="claims.html"><span class="icon">▤</span>Claims</a><a data-nav="network" href="network.html"><span class="icon">⌘</span>Fraud Network</a><a data-nav="providers" href="providers.html"><span class="icon">✚</span>Providers</a><a data-nav="learning" href="learning.html"><span class="icon">↻</span>Learning</a></nav><div class="app-side-bottom"><div class="engine"><i></i> AI engine ready • local demo</div></div></aside>
<main class="app-main"><header class="app-top"><div style="display:flex;gap:10px;align-items:center"><button class="mobile-menu">☰</button><div><p class="tiny">SCREENING QUEUE</p><h1>Claims</h1></div></div><div class="top-actions"><label class="btn soft">↑ Import CSV<input id="csvInput" type="file" accept=".csv" hidden></label><button class="btn soft" id="exportBtn">↓ Export high risk</button></div></header>
<section class="page-card table-card"><div class="panel-head"><div><p class="tiny">REVIEW WORKSPACE</p><h3>All screened claims</h3></div><a class="btn primary" href="check-claim.html">+ New claim</a></div><div class="table-tools"><input id="search" placeholder="Search claim ID or provider"><select id="risk"><option value="all">All risk levels</option><option value="high">High risk</option><option value="medium">Medium risk</option><option value="low">Low risk</option></select><select id="sort"><option value="score">Highest risk first</option><option value="amount">Highest amount</option><option value="newest">Newest first</option></select></div><div class="table-wrap"><table><thead><tr><th>Claim</th><th>Provider</th><th>Amount</th><th>Risk</th><th>Score</th><th>Why</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><p id="count" class="muted" style="font-size:8px;margin:12px 0 0"></p></section></main></div><script src="data.js"></script><script src="common.js"></script><script>
setupAppShell('claims');const search=qs('#search');search.value=localStorage.getItem('cs_search')||'';localStorage.removeItem('cs_search');function render(){let list=getClaims(),q=search.value.toLowerCase(),r=qs('#risk').value,s=qs('#sort').value;list=list.filter(x=>(!q||x.id.toLowerCase().includes(q)||x.provider.toLowerCase().includes(q))&&(r==='all'||x.risk===r));list.sort((a,b)=>s==='amount'?b.amount-a.amount:s==='newest'?b.date.localeCompare(a.date):b.score-a.score);qs('#tbody').innerHTML=list.map(x=>`<tr><td><b>${x.id}</b><br><span class="muted">${x.date}</span></td><td>${x.provider}</td><td><b>${money(x.amount)}</b></td><td><span class="risk-pill ${x.risk}">${riskLabel(x.risk)}</span></td><td><b>${x.score}</b></td><td class="muted">${x.reason}</td><td><button class="review-btn" onclick="loadClaim('${x.id}')">Review</button></td></tr>`).join('');qs('#count').textContent=`Showing ${list.length} of ${getClaims().length} claims`}search.oninput=render;qs('#risk').onchange=render;qs('#sort').onchange=render;render();window.loadClaim=id=>{const x=getClaims().find(c=>c.id===id);if(x){localStorage.setItem('cs_review_claim',JSON.stringify(x));location.href='check-claim.html'}};
qs('#exportBtn').onclick=()=>{const list=getClaims().filter(x=>x.risk==='high'),rows=[['claim_id','provider','patient','amount','score','risk','reason'],...list.map(x=>[x.id,x.provider,x.patient,x.amount,x.score,x.risk,x.reason])],csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='claimshield_high_risk.csv';a.click();URL.revokeObjectURL(a.href)};
qs('#csvInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;const lines=(await f.text()).trim().split(/\r?\n/);if(lines.length<2)return;const hs=lines[0].split(',').map(x=>x.trim().replaceAll('"','').toLowerCase()),claims=getClaims();let n=0;for(const line of lines.slice(1)){const vs=line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)?.map(v=>v.trim().replace(/^"|"$/g,''))||[],row=Object.fromEntries(hs.map((h,i)=>[h,vs[i]||''])),score=Math.max(1,Math.min(99,+row.score||Math.round(15+Math.random()*75)));claims.unshift({id:row.claim_id||row.id||`CSV-${Date.now()}-${n}`,provider:row.provider||'Imported Provider',patient:row.patient||'P-CSV',amount:+row.amount||0,score,risk:riskFromScore(score),reason:row.reason||'Imported signal',signals:(row.signals||'Imported pattern').split('|'),date:new Date().toISOString().slice(0,10)});n++}setClaims(claims);render();toast(`${n} claims imported`)};
</script></body></html>
